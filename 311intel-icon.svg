<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a749f"/>
      <stop offset="100%" stop-color="#063f5c"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="1" y="1" width="98" height="98" rx="21" fill="url(#bg)"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#04283c" stroke-width="1"/>

  <!-- subtle glow -->
  <circle cx="50" cy="46" r="34" fill="url(#ringGlow)"/>

  <!-- radar rings -->
  <circle cx="50" cy="46" r="30" fill="none" stroke="#eaf5fb" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="50" cy="46" r="22" fill="none" stroke="#eaf5fb" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="50" cy="46" r="14" fill="none" stroke="#f5fbfe" stroke-opacity="0.85" stroke-width="2.25"/>

  <!-- center hit -->
  <circle cx="50" cy="46" r="6.5" fill="#ffffff"/>

  <!-- ping accent -->
  <circle cx="73" cy="23" r="7.5" fill="#063f5c"/>
  <circle cx="73" cy="23" r="6" fill="#f5a623"/>

  <!-- baseline / ground mark -->
  <rect x="27" y="80" width="46" height="4.5" rx="2.25" fill="#f5fbfe" fill-opacity="0.85"/>
</svg>
