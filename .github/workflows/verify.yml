name: Verify

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python unit tests
        run: python3 -m unittest tests/test_build_base44_forecast_input.py tests/test_build_gbfs_snapshot.py tests/test_build_request_vehicle_traces.py tests/test_build_policy_boundary_analysis.py tests/test_columbus_311_feed.py tests/test_event_gbfs_runner.py tests/test_server.py

      - name: Validate container build
        run: docker build --tag 311-field-intelligence:ci .
